global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/remote-tab-alerts.yml

scrape_configs:
  - job_name: browshare-remote-tab-signaling
    static_configs:
      - targets:
          - signaling-host:9090

  - job_name: browshare-remote-tab-standalone
    metrics_path: /metrics
    static_configs:
      - targets:
          - chrome-worker-host:9230

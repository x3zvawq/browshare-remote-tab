<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Generic-family preference and CJK fallback, not a replacement for explicit site fonts. -->
  <alias>
    <family>serif</family>
    <prefer><family>Maple Mono CN</family></prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Maple Mono CN</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>Maple Mono CN</family></prefer>
  </alias>
</fontconfig>
